<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Planner</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="app">

  <!-- ══════════════════════════════════════════════════════════
       SIDEBAR
  ══════════════════════════════════════════════════════════ -->
  <nav id="sidebar">
    <div class="sb-top">
      <div class="wordmark">
        <div class="wm-icon"></div>
        <span>Planner</span>
      </div>
      <div class="sb-nav">
        <button class="nav-btn active" data-view="today" onclick="nav('today')">
          <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1 6h14" stroke="currentColor" stroke-width="1.4"/><path d="M5 1v2M11 1v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          Today
        </button>
        <button class="nav-btn" data-view="week" onclick="nav('week')">
          <svg viewBox="0 0 16 16"><rect x="1" y="2" width="14" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M1 6h14M5.5 1v2M10.5 1v2" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><path d="M4 9.5h2.5M4 12h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
          Week
        </button>
        <button class="nav-btn" data-view="tasks" onclick="nav('tasks')">
          <svg viewBox="0 0 16 16"><path d="M2 4h12M2 8h8M2 12h6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
          All Tasks
        </button>
      </div>

      <div class="sb-section-label">Categories</div>
      <div class="legend">
        <div class="legend-row"><span class="dot cat-hw"></span>Homework / Assignment</div>
        <div class="legend-row"><span class="dot cat-test"></span>Test / Major Project</div>
        <div class="legend-row"><span class="dot cat-ec"></span>Extracurricular</div>
        <div class="legend-row"><span class="dot cat-personal"></span>Personal / Life</div>
      </div>
    </div>

    <div class="sb-bottom">
      <div class="sync-row" id="sync-row">
        <span class="sync-dot" id="sync-dot"></span>
        <span id="sync-label">Ready</span>
      </div>
      <button class="sync-btn" onclick="syncFromNotion()">
        <svg viewBox="0 0 16 16"><path d="M13.5 2.5C12 1 10.1.5 8 .5 4 .5 1 3.5 1 7.5M2.5 13.5C4 15 5.9 15.5 8 15.5c4 0 7-3 7-7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/><path d="M13.5 2.5v3h-3M2.5 13.5v-3h3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
        Sync Notion
      </button>
    </div>
  </nav>

  <!-- ══════════════════════════════════════════════════════════
       MAIN
  ══════════════════════════════════════════════════════════ -->
  <main id="main">

    <!-- TODAY ───────────────────────────────────────── -->
    <section class="view active" id="view-today">
      <header class="view-hd">
        <div class="view-hd-left">
          <h1 id="today-h1">Today</h1>
          <p id="today-date" class="view-sub"></p>
        </div>
        <div class="view-hd-right">
          <button class="btn-add" onclick="openTaskModal()">+ New task</button>
        </div>
      </header>

      <!-- Focus strip -->
      <div class="focus-strip">
        <span class="focus-label">Focus</span>
        <input id="focus-in" class="focus-in" placeholder="What's the one thing you need to get done today?" oninput="saveFocus()">
      </div>

      <!-- Schedule + sidebar -->
      <div class="today-body">
        <div class="schedule-wrap">
          <div class="section-row">
            <h2 class="section-h">Schedule</h2>
            <div class="day-nav">
              <button onclick="shiftSchedule(-1)">‹</button>
              <span id="sched-label"></span>
              <button onclick="shiftSchedule(1)">›</button>
            </div>
          </div>
          <div id="schedule" class="schedule"></div>
        </div>

        <div class="today-right">
          <div class="section-row"><h2 class="section-h">Due soon</h2><button class="btn-text-sm" onclick="nav('tasks')">All →</button></div>
          <div id="due-soon" class="task-stack"></div>
        </div>
      </div>
    </section>

    <!-- WEEK ────────────────────────────────────────── -->
    <section class="view" id="view-week">
      <header class="view-hd">
        <div class="view-hd-left">
          <h1>Week</h1>
          <p id="week-sub" class="view-sub"></p>
        </div>
        <div class="view-hd-right">
          <button class="icon-btn" onclick="shiftWeek(-1)">‹</button>
          <button class="icon-btn" onclick="shiftWeek(1)">›</button>
          <button class="btn-add" onclick="openTaskModal()">+ New task</button>
        </div>
      </header>
      <div id="week-grid" class="week-grid"></div>
    </section>

    <!-- ALL TASKS ───────────────────────────────────── -->
    <section class="view" id="view-tasks">
      <header class="view-hd">
        <div class="view-hd-left">
          <h1>All Tasks</h1>
          <p class="view-sub">Synced from Notion · only active tasks shown</p>
        </div>
        <div class="view-hd-right">
          <select class="filter-sel" id="filter-cat" onchange="renderTasksView()">
            <option value="">All categories</option>
            <option value="hw">Homework</option>
            <option value="test">Test / Major</option>
            <option value="ec">Extracurricular</option>
            <option value="personal">Personal</option>
          </select>
          <select class="filter-sel" id="filter-class" onchange="renderTasksView()">
            <option value="">All classes</option>
            <option>AP Language</option>
            <option>AP Biology</option>
            <option>AP US History</option>
            <option>Honors Spanish IV</option>
            <option>Precalculus</option>
            <option>Congressional Debate</option>
            <option>Harvard Pre-College</option>
          </select>
          <button class="btn-add" onclick="openTaskModal()">+ New task</button>
        </div>
      </header>
      <div class="kanban" id="kanban"></div>
    </section>

  </main>
</div>

<!-- ══════════════════════════════════════════════════════════
     TASK MODAL
══════════════════════════════════════════════════════════ -->
<div class="overlay" id="task-overlay" onclick="overlayClick(event,'task-overlay')">
  <div class="modal" id="task-modal">
    <div class="modal-hd">
      <span id="modal-title">New task</span>
      <button class="modal-x" onclick="closeTaskModal()">✕</button>
    </div>
    <div class="modal-bd">
      <input class="m-input" id="t-name" placeholder="Task name" autofocus>

      <div class="m-row">
        <div class="m-field">
          <label class="m-label">Category</label>
          <div class="cat-picker" id="cat-picker">
            <button class="cat-btn active" data-cat="hw" onclick="pickCat('hw')"><span class="dot cat-hw"></span>Homework</button>
            <button class="cat-btn" data-cat="test" onclick="pickCat('test')"><span class="dot cat-test"></span>Test / Major</button>
            <button class="cat-btn" data-cat="ec" onclick="pickCat('ec')"><span class="dot cat-ec"></span>Extracurricular</button>
            <button class="cat-btn" data-cat="personal" onclick="pickCat('personal')"><span class="dot cat-personal"></span>Personal</button>
          </div>
        </div>
      </div>

      <div class="m-row">
        <div class="m-field">
          <label class="m-label">Class</label>
          <select class="m-select" id="t-class">
            <option value="">None</option>
            <option>AP Language</option>
            <option>AP Biology</option>
            <option>AP US History</option>
            <option>Honors Spanish IV</option>
            <option>Precalculus</option>
            <option>Congressional Debate</option>
            <option>Harvard Pre-College</option>
            <option>Extracurricular</option>
            <option>Personal</option>
          </select>
        </div>
        <div class="m-field">
          <label class="m-label">Status</label>
          <select class="m-select" id="t-status">
            <option>Not started</option>
            <option>In progress</option>
            <option>Done</option>
          </select>
        </div>
      </div>

      <div class="m-row">
        <div class="m-field">
          <label class="m-label">Due date</label>
          <input class="m-input" type="date" id="t-due">
        </div>
        <div class="m-field">
          <label class="m-label">Est. time</label>
          <input class="m-input" id="t-est" placeholder="e.g. 2h">
        </div>
      </div>

      <div class="m-field">
        <label class="m-label">Priority</label>
        <div class="pri-row" id="pri-row">
          <button class="pri-btn" data-p="low" onclick="pickPri('low')">Low</button>
          <button class="pri-btn active-med" data-p="medium" onclick="pickPri('medium')">Medium</button>
          <button class="pri-btn" data-p="high" onclick="pickPri('high')">High</button>
        </div>
      </div>

      <textarea class="m-textarea" id="t-desc" placeholder="Notes / description" rows="2"></textarea>
    </div>
    <div class="modal-ft">
      <button class="btn-ghost" onclick="closeTaskModal()">Cancel</button>
      <button id="modal-save-btn" class="btn-solid" onclick="saveTask()">Save to Notion</button>
    </div>
  </div>
</div>

<!-- BLOCK MODAL -->
<div class="overlay" id="block-overlay" onclick="overlayClick(event,'block-overlay')">
  <div class="modal modal-sm" id="block-modal">
    <div class="modal-hd">
      <span id="block-modal-title">Add block</span>
      <button class="modal-x" onclick="closeBlockModal()">✕</button>
    </div>
    <div class="modal-bd">
      <input class="m-input" id="b-label" placeholder="Label (e.g. Debate practice)" autofocus>
      <div class="m-field" style="margin-top:12px">
        <label class="m-label">Type</label>
        <div class="block-type-grid" id="block-type-grid"></div>
      </div>
      <div class="m-row" style="margin-top:12px">
        <div class="m-field">
          <label class="m-label">Start</label>
          <input class="m-input" type="time" id="b-start">
        </div>
        <div class="m-field">
          <label class="m-label">End</label>
          <input class="m-input" type="time" id="b-end">
        </div>
      </div>
    </div>
    <div class="modal-ft">
      <button class="btn-ghost" onclick="closeBlockModal()">Cancel</button>
      <button class="btn-solid" onclick="saveBlock()">Add</button>
    </div>
  </div>
</div>

<script src="js/store.js"></script>
<script src="js/notion.js"></script>
<script src="js/schedule.js"></script>
<script src="js/tasks.js"></script>
<script src="js/week.js"></script>
<script src="js/app.js"></script>
</body>
</html>
