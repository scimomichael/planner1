<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a84ff"/>
      <stop offset="100%" stop-color="#5e5ce6"/>
    </linearGradient>
  </defs>
  <!-- Rounded-square background with Apple-like corner radius (~22% of edge) -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bg)"/>
  <!-- Subtle inner highlight to match iOS icon glossiness -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bg)" opacity="0"/>
  <!-- Calendar body -->
  <g fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <rect x="108" y="148" width="296" height="272" rx="32" ry="32"/>
    <!-- Top bar separator -->
    <line x1="108" y1="220" x2="404" y2="220"/>
    <!-- Hanging rings (the "clips" at top) -->
    <line x1="176" y1="108" x2="176" y2="168"/>
    <line x1="336" y1="108" x2="336" y2="168"/>
  </g>
  <!-- Calendar day dots to imply a grid -->
  <g fill="#ffffff">
    <circle cx="176" cy="290" r="14"/>
    <circle cx="256" cy="290" r="14"/>
    <circle cx="336" cy="290" r="14"/>
    <circle cx="176" cy="356" r="14"/>
    <circle cx="256" cy="356" r="14"/>
  </g>
</svg>
